# Configuración de los 3 sentinels (Persona 2, etapa 5). Los tres usan este mismo fichero.
# Sentinel reescribe su configuración mientras funciona, por eso cada contenedor
# copia este fichero dentro de sí mismo antes de arrancar (ver docker-compose.sentinel.yml).

port 26379

# Vigilamos al maestro (IP fija 172.30.0.2) y le damos el nombre "aforo".
# El 2 es el quorum: hacen falta 2 sentinels de acuerdo para dar el maestro por caído
sentinel monitor aforo 172.30.0.2 6379 2

# Si el maestro no responde durante 5 segundos, el sentinel lo considera caído
sentinel down-after-milliseconds aforo 5000

# Tiempo máximo para terminar un failover
sentinel failover-timeout aforo 20000

# Tras el failover, las réplicas se sincronizan con el nuevo maestro de una en una
sentinel parallel-syncs aforo 1
